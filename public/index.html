<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpPilot AI - B2B Multi-Tenant Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 { margin: 0; font-size: 24px; color: var(--accent-color); }

        .auth-container, .dashboard-container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
        }

        .hidden { display: none !important; }

        input, textarea, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px 0;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }

        button {
            background: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        button:hover { opacity: 0.9; }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            background: #334155;
            display: inline-block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .stat-card h3 { margin: 0 0 8px 0; font-size: 14px; color: var(--text-sub); }
        .stat-card p { margin: 0; font-size: 22px; font-weight: bold; }

        .kb-item, .chat-item {
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid var(--accent-color);
        }

        code {
            display: block;
            background: #000;
            padding: 12px;
            border-radius: 6px;
            color: #4ade80;
            overflow-x: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🤖 HelpPilot AI</h1>
        <div id="user-status">
            <span id="trial-badge" class="badge">Store Owner Portal</span>
            <button id="logout-btn" onclick="handleLogout()" class="hidden" style="width: auto; padding: 6px 12px; margin: 0 0 0 10px;">Logout</button>
        </div>
    </header>

    <!-- AUTH SECTION (SIGN UP / LOGIN) -->
    <div id="auth-section" class="auth-container">
        <h2>Store Owner Portal</h2>
        <p style="color: var(--text-sub);">Login or Create Workspace to manage your chatbot & Knowledge Base.</p>
        
        <input type="email" id="auth-email" placeholder="Store Email Address" required>
        <input type="password" id="auth-password" placeholder="Password" required>
        <input type="text" id="auth-store" placeholder="Store Name (e.g. Royal Fashion)">
