<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #080c14; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
        
        /* Top Navigation Bar */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #1e293b; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 22px; font-weight: 800; color: #6366f1; letter-spacing: -0.5px; }
        .nav-items { display: flex; gap: 24px; list-style: none; align-items: center; }
        .nav-link { color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .nav-link:hover { color: #fff; }
        .btn-primary { background: #6366f1; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; transition: 0.2s; }
        .btn-primary:hover { background: #4f46e5; }
        .btn-outline { background: transparent; color: #fff; border: 1px solid #334155; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-outline:hover { background: #1e293b; }
        
        /* Hero Section */
        .hero { text-align: center; padding: 80px 20px 60px; max-width: 900px; margin: 0 auto; }
        .badge { background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.3); color: #818cf8; font-size: 13px; padding: 6px 14px; border-radius: 20px; display: inline-block; margin-bottom: 20px; font-weight: 600; }
        .hero-title { font-size: 48px; font-weight: 800; line-height: 1.2; margin-bottom: 20px; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-sub { font-size: 18px; color: #94a3b8; margin-bottom: 36px; line-height: 1.6; }
        .hero-btns { display: flex; gap: 16px; justify-content: center; }
        .btn-secondary { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; }
        
        /* Dashboard Container */
        .dashboard-container { display: flex; max-width: 1200px; margin: 40px auto 80px; background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; height: 650px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .sidebar { width: 250px; background: #0b0f19; border-right: 1px solid #1e293b; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
        .sidebar-item { padding: 12px 16px; border-radius: 8px; color: #94a3b8; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .sidebar-item.active, .sidebar-item:hover { background: #1e293b; color: #fff; }
        
        .main-content { flex: 1; padding: 32px; overflow-y: auto; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: #0b0f19; border: 1px solid #334155; border-radius: 10px; padding: 16px; }
        .stat-label { color: #94a3b8; font-size: 12px; margin-bottom: 6px; }
        .stat-value { font-size: 24px; font-weight: 700; color: #fff; }

        .input-field { width: 100%; background: #0b0f19; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: #fff; outline: none; margin-bottom: 12px; font-size: 14px; }
        .code-box { background: #050811; border: 1px solid #334155; border-radius: 8px; padding: 14px; font-family: monospace; color: #38bdf8; font-size: 13px; word-break: break-all; }
        
        .pricing-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .plan-card { background: #0b0f19; border: 1px solid #334155; border-radius: 12px; padding: 24px; }
        .plan-card.featured { border-color: #6366f1; background: #111827; }
        
        .view-section { display: none; }
        .view-section.active { display: block; }
        .kb-item { background: #0b0f19; padding: 12px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; border: 1px solid #334155; }

        /* Auth Modal Overlay */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-card { background: #0f172a; border: 1px solid #334155; border-radius: 16px; padding: 32px; width: 400px; box-shadow: 0 25px 50px rgba(0,0,0,0.7); }
    </style>
</head>
