<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpPilot AI - Operations Suite</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0b0f19; 
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 72px; background: #111827; border-right: 1px solid #1f2937;
            display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 24px;
        }
        .sidebar-logo {
            width: 40px; height: 40px; background: linear-gradient(135deg, #6366f1, #4f46e5);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: white; font-size: 18px;
        }
        .nav-item {
            width: 44px; height: 44px; border-radius: 10px; display: flex;
            align-items: center; justify-content: center; color: #9ca3af; cursor: pointer; transition: all 0.2s;
        }
        .nav-item:hover, .nav-item.active { background: #1f2937; color: #6366f1; }
        .view-section { flex: 1; display: none; height: 100vh; overflow: hidden; }
        .view-section.active-view { display: flex; }
        .conv-list-panel { width: 320px; background: #0f172a; border-right: 1px solid #1f2937; display: flex; flex-direction: column; }
        .app-switcher-box { padding: 16px; border-bottom: 1px solid #1f2937; background: #111827; }
        .app-switcher-box label { font-size: 11px; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 6px; }
        #app-select { width: 100%; background: #1e293b; border: 1px solid #334155; color: white; padding: 8px 12px; border-radius: 8px; outline: none; }
        .conv-header { padding: 16px 20px; font-size: 15px; font-weight: 600; border-bottom: 1px solid #1f2937; color: #cbd5e1; display: flex; justify-content: space-between; align-items: center; }
        .conv-items { flex: 1; overflow-y: auto; }
        .conv-item { padding: 16px 20px; border-bottom: 1px solid #1f2937; background: #1e293b; display: flex; justify-content: space-between; align-items: center; }
        .conv-item .name { font-weight: 600; font-size: 14px; margin-bottom: 4px; color: #f1f5f9; }
        .conv-item .preview { font-size: 13px; color: #94a3b8; }
        .badge { font-size: 10px; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
        .badge.active { background: rgba(34,197,94,0.15); color: #22c55e; }
        .badge.escalated { background: rgba(239,68,68,0.15); color: #ef4444; }
        .chat-workspace { flex: 1; display: flex; flex-direction: column; background: #0b0f19; }
        .workspace-header { padding: 16px 24px; background: #0f172a; border-bottom: 1px solid #1f2937; }
        .visitor-info h3 { font-size: 16px; font-weight: 600; }
        .visitor-info p { font-size: 12px; color: #22c55e; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
        .chat-messages { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .msg { max-width: 65%; padding: 14px 18px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-break: break-word; }
        .msg.bot { background: #1e293b; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg.user { background: #6366f1; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.note { background: rgba(234, 179, 8, 0.1); border: 1px dashed #eab308; color: #fde047; align-self: center; max-width: 85%; font-size: 13px; }
        .typing-indicator { padding: 12px 16px; display: flex; gap: 4px; align-self: flex-start; background: #1e293b; border-radius: 12px; }
        .typing-indicator span { width: 6px; height: 6px; background: #94a3b8; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
        .chat-input-area { padding: 20px 24px; background: #0f172a; border-top: 1px solid #1f2937; display: flex; flex-direction: column; gap: 10px; }
        .input-row { display: flex; gap: 12px; }
        #chat-input { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px 16px; color: white; font-size: 14px; outline: none; }
        #send-btn { background: #6366f1; color: white; border: none; padding: 0 24px; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .note-btn { background: transparent; border: 1px solid #eab308; color: #eab308; padding: 0 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .details-panel { width: 280px; background: #0f172a; border-left: 1px solid #1f2937; padding: 24px; }
        .details-panel h4 { font-size: 14px; color: #94a3b8; margin-bottom: 14px; text-transform: uppercase; }
        .detail-row { font-size: 13px; margin-bottom: 12px; color: #94a3b8; display: flex; justify-content: space-between; }
        .detail-row span { color: #f8fafc; font-weight: 500; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">H</div>
        <div class="nav-item active" title="Inbox">💬</div>
    </div>
    <div class="view-section active-view" style="flex:1; display:flex;">
        <div class="conv-list-panel">
            <div class="app-switcher-box">
                <label>Active Workspace</label>
                <select id="app-select">
                    <option value="app_saas_main">HelpPilot SaaS (Main)</option>
                </select>
            </div>
            <div class="conv-header"><span>Shared Inbox</span></div>
            <div class="conv-items">
                <div class="conv-item">
                    <div>
                        <div class="name">Visitor #DemoUser</div>
                        <div class="preview" id="conv-preview">Ask any question to test AI...</div>
                    </div>
                    <span id="conv-badge" class="badge active">Active</span>
                </div>
            </div>
        </div>
        <div class="chat-workspace">
            <div class="workspace-header">
                <div class="visitor-info">
                    <h3 id="active-app-title">HelpPilot SaaS (Main)</h3>
                    <p id="assistant-status">AI Assistant Connected & Active</p>
                </div>
            </div>
            <div id="chat-messages" class="chat-messages">
                <div class="msg bot">👋 Hello! I am your AI customer support assistant. Test queries like "refund policy" or type notes.</div>
            </div>
            <div id="typing-indicator" class="typing-indicator hidden" style="margin-left: 24px;">
                <span></span><span></span><span></span>
            </div>
            <div class="chat-input-area">
                <div class="input-row">
                    <input type="text" id="chat-input" placeholder="Type a message or internal note..." onkeypress="handleKeyPress(event)" />
                    <button class="note-btn" type="button" onclick="handleAddNote()">+ Note</button>
                    <button id="send-btn" type="button" onclick="handleSend()">Send</button>
                </div>
            </div>
        </div>
        <div class="details-panel">
            <h4>Customer Profile</h4>
            <div class="detail-row">Name: <span>Devansh</span></div>
            <div class="detail-row">Plan: <span style="color: #22c55e;">Pro Tier</span></div>
            <div class="detail-row">Sentiment: <span id="panel-sentiment" style="color: #22c55e;">Neutral</span></div>
        </div>
    </div>
    <script>
        function handleAddNote() {
            const input = document.getElementById('chat-input');
            const messages = document.getElementById('chat-messages');
            const text = input.value.trim();
            if (!text) return;
            const noteDiv = document.createElement('div');
            noteDiv.className = 'msg note';
            noteDiv.textContent = `🔒 [Internal Note]: ${text}`;
            messages.appendChild(noteDiv);
            input.value = '';
            messages.scrollTop = messages.scrollHeight;
        }

        async function handleSend() {
            const input = document.getElementById('chat-input');
            const messages = document.getElementById('chat-messages');
            const typing = document.getElementById('typing-indicator');
            const convPreview = document.getElementById('conv-preview');
            const convBadge = document.getElementById('conv-badge');
            const panelSentiment = document.getElementById('panel-sentiment');
            const assistantStatus = document.getElementById('assistant-status');
            const appSelectElem = document.getElementById('app-select');

            const text = input.value.trim();
            if (!text) return;
            const currentAppId = appSelectElem ? appSelectElem.value : 'app_saas_main';

            const userDiv = document.createElement('div');
            userDiv.className = 'msg user';
            userDiv.textContent = text;
            messages.appendChild(userDiv);
            input.value = '';
            messages.scrollTop = messages.scrollHeight;
            convPreview.textContent = text;

            typing.classList.remove('hidden');
            messages.scrollTop = messages.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, appId: currentAppId })
                });
                const data = await res.json();
                typing.classList.add('hidden');

                const botDiv = document.createElement('div');
                botDiv.className = 'msg bot';
                botDiv.textContent = data.reply || "No response received.";
                messages.appendChild(botDiv);
                messages.scrollTop = messages.scrollHeight;

                if (data.sentiment === 'frustrated' || data.escalated) {
                    convBadge.textContent = 'Needs Human';
                    convBadge.className = 'badge escalated';
                    panelSentiment.textContent = 'Frustrated ⚠️';
                    panelSentiment.style.color = '#ef4444';
                    assistantStatus.textContent = 'Escalated to Human Agent Queue';
                    assistantStatus.style.color = '#ef4444';
                } else {
                    convBadge.textContent = 'Active';
                    convBadge.className = 'badge active';
                    panelSentiment.textContent = 'Neutral';
                    panelSentiment.style.color = '#22c55e';
                    assistantStatus.textContent = 'AI Assistant Connected & Active';
                    assistantStatus.style.color = '#22c55e';
                }
            } catch (err) {
                typing.classList.add('hidden');
                const errDiv = document.createElement('div');
                errDiv.className = 'msg bot';
                errDiv.textContent = "Connection error. Please try again.";
                messages.appendChild(errDiv);
                messages.scrollTop = messages.scrollHeight;
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') handleSend();
        }
    </script>
</body>
</html>
