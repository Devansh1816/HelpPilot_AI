<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpPilot AI - Operations Suite</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0b0f19; 
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. Left Sidebar Navigation */
        .sidebar {
            width: 72px;
            background: #111827;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 24px;
        }
        .sidebar-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 18px;
        }
        .nav-item {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 18px;
        }
        .nav-item:hover, .nav-item.active {
            background: #1f2937;
            color: #6366f1;
        }

        /* 2. Views Container */
        .view-section {
            flex: 1;
            display: none;
            height: 100vh;
            overflow: hidden;
        }
        .view-section.active-view {
            display: flex;
        }

        /* --- VIEW 1: INBOX & ADVANCED CHAT --- */
        .conv-list-panel {
            width: 320px;
            background: #0f172a;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
        }
        .app-switcher-box {
            padding: 16px;
            border-bottom: 1px solid #1f2937;
            background: #111827;
        }
        .app-switcher-box label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 6px;
        }
        #app-select {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        .conv-header {
            padding: 16px 20px;
            font-size: 15px;
            font-weight: 600;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #cbd5e1;
        }
        .conv-items {
            flex: 1;
            overflow-y: auto;
        }
        .conv-item {
            padding: 16px 20px;
            border-bottom: 1px solid #1f2937;
            cursor: pointer;
            background: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .conv-item .name { font-weight: 600; font-size: 14px; margin-bottom: 4px; color: #f1f5f9; }
        .conv-item .preview { font-size: 13px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .badge {
            font-size: 10px; padding: 2px 8px; border-radius: 12px; font-weight: 600;
        }
        .badge.active { background: rgba(34,197,94,0.15); color: #22c55e; }
        .badge.escalated { background: rgba(239,68,68,0.15); color: #ef4444; }

        .chat-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0b0f19;
        }
        .workspace-header {
            padding: 16px 24px;
            background: #0f172a;
            border-bottom: 1px solid #1f2937;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .visitor-info h3 { font-size: 16px; font-weight: 600; }
        .visitor-info p { font-size: 12px; color: #22c55e; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
        .visitor-info p::before { content: ''; width: 8px; height: 8px; background: #22c55e; border-radius: 50%; display: inline-block; }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg {
            max-width: 65%;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }
        .msg.bot {
            background: #1e293b;
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .msg.user {
            background: #6366f1;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .msg.note {
            background: rgba(234, 179, 8, 0.1);
            border: 1px dashed #eab308;
            color: #fde047;
            align-self: center;
            max-width: 85%;
            font-size: 13px;
        }
        
        .typing-indicator {
            padding: 12px 16px;
            display: flex;
            gap: 4px;
            align-self: flex-start;
            background: #1e293b;
            border-radius: 12px;
        }
        .typing-indicator span {
            width: 6px; height: 6px; background: #94a3b8; border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

        .chat-input-area {
            padding: 20px 24px;
            background: #0f172a;
            border-top: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-row {
            display: flex;
            gap: 12px;
        }
        #chat-input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px 16px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        #chat-input:focus { border-color: #6366f1; }
        #send-btn {
            background: #6366f1; color: white; border: none; padding: 0 24px;
            border-radius: 10px; font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        #send-btn:hover { background: #4f46e5; }
        
        .note-btn {
            background: transparent; border: 1px solid #eab308; color: #eab308; padding: 0 16px;
            border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .note-btn:hover { background: rgba(234, 179, 8, 0.1); }

        .details-panel {
            width: 280px; background: #0f172a; border-left: 1px solid #1f2937;
